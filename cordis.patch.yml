# dsh-open bundle layer: mounts the host half in every profile that lists
# `dsh-open` in dsh.profile.bundles (or depends on it). The browser half needs
# no row here: the client module system composes it from the package's
# `dsh.client` declaration once this host row is active.
- insert:
    - id: dsh-open
      name: dsh-open
